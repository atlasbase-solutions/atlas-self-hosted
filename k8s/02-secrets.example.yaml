# Copy this file to 02-secrets.yaml, replace every CHANGE_ME value, and never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: atlas
type: Opaque
stringData:
  PORTAL_DATABASE_URL: postgres://atlas_portal:CHANGE_ME_PORTAL_DB@portal-postgres:5432/atlas_portal?sslmode=disable
  PORTAL_OWNER_EMAIL: CHANGE_ME_OWNER_EMAIL
  PORTAL_OWNER_PASSWORD: CHANGE_ME_OWNER_PASSWORD
  PORTAL_SECRET_KEY: CHANGE_ME_RANDOM_SMTP_ENCRYPTION_KEY
  ATLAS_CONFIG_SECRET_KEY: CHANGE_ME_SHARED_CONFIG_SECRET
  # Previous values of the two encryption keys, filled in only while a key
  # rotation is in progress: secrets sealed before the rotation stay readable
  # and invitation links issued before it keep being accepted. Re-encrypt with
  # the atlas-rotate-secrets tool in the portal image, then clear them again.
  PORTAL_SECRET_KEY_PREVIOUS: ""
  ATLAS_CONFIG_SECRET_KEY_PREVIOUS: ""
  PORTAL_CLICKHOUSE_URL: http://atlas_gateway:CHANGE_ME_CLICKHOUSE@clickhouse:8123/atlas_gateway
  PG_DSN: postgres://atlas_gateway:CHANGE_ME_GATEWAY_DB@gateway-postgres:5432/atlas_gateway?sslmode=disable
  CLICKHOUSE_DSN: http://atlas_gateway:CHANGE_ME_CLICKHOUSE@clickhouse:8123/atlas_gateway
  PORTAL_POSTGRES_PASSWORD: CHANGE_ME_PORTAL_DB
  GATEWAY_POSTGRES_PASSWORD: CHANGE_ME_GATEWAY_DB
  CLICKHOUSE_PASSWORD: CHANGE_ME_CLICKHOUSE
  # The license string from your Atlas manager (see README.md "Licensing").
  # Portal and Gateway read this same Secret, so one value covers both.
  # Leaving it empty is valid for a first look: the installation starts, but
  # serves no traffic until a license is set. For a cluster with no outbound
  # internet access, see k8s/README.md "License delivery".
  ATLAS_LICENSE_TOKEN: ""
