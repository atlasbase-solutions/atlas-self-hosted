apiVersion: v1
kind: Service
metadata:
  name: portal-postgres
  namespace: atlas
spec:
  selector:
    app.kubernetes.io/name: portal-postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portal-postgres
  namespace: atlas
spec:
  serviceName: portal-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-postgres
        app.kubernetes.io/part-of: atlas
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24
          env:
            - name: POSTGRES_DB
              value: atlas_portal
            - name: POSTGRES_USER
              value: atlas_portal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-secrets
                  key: PORTAL_POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U atlas_portal -d atlas_portal"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
---
