apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: atlas
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-init, app.kubernetes.io/part-of: atlas}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.2.1
          command: ["/bin/sh", "/opt/atlas/create-topics.sh"]
          volumeMounts:
            - {name: script, mountPath: /opt/atlas, readOnly: true}
      volumes:
        - name: script
          configMap:
            name: kafka-topics
            defaultMode: 0555
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gateway-migrate
  namespace: atlas
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway-migrate, app.kubernetes.io/part-of: atlas}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: gateway-migrate
          image: registry.example.com/atlas/gateway:1.0.12
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/atlas-migrate"]
          args: ["-target=all", "-seed=false", "-timeout=2m"]
          envFrom:
            - secretRef: {name: atlas-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}

